server:
  port: ${SERVER_PORT}
  tomcat:
    max-http-form-post-size: 500MB

spring:
  application:
    name: BTM-Learning
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  api:
    prefix: /api/v1
  jwt:
  signerKey:  ${JWT_SIGNER_KEY}
  access-expiration: 900000                 # 15 phút
  refresh-expiration: 604800000             # 7 ngày

front-end:
  oauth2-redirect-url: ${URL_FRONTEND}

vnpay:
  tmn-code: ${TMN_CODE}
  hash-secret: ${HASH_SECRET}
  pay-url: ${PAY_URL}
  return-url: ${RETURN_URL}
  api-url: ${API_URL_VNPAY}
  frontend-return-url: ${FRONTEND_RETURN_URL}

openai:
  api-url: ${API_URL_OPEN_AI}
  api-key: ${API_KEY}
  model: ${MODEL}
  max-tokens: 1000
  temperature: 0.7

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
api:
  prefix: /api/v1
jwt:
  signerKey:  ${JWT_SIGNER_KEY}
  access-expiration: 900000                 # 15 phút
  refresh-expiration: 604800000             # 7 ngày


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
