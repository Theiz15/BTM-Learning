server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: BTM-Learning

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
