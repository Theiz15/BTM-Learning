server:
  port: ${SERVER_PORT:8088}
  tomcat:
    max-http-form-post-size: 500MB

spring:
  application:
    name: BTM-Learning
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/btm_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - email
              - profile

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  api:
    prefix: /api/v1
  jwt:
  signerKey:  ${JWT_SIGNER_KEY:local-dev-jwt-signer-key-change-me-please}
  access-expiration: 900000                 # 15 phút
  refresh-expiration: 604800000             # 7 ngày

front-end:
  oauth2-redirect-url: ${URL_FRONTEND:http://localhost:3000/oauth2/redirect}

vnpay:
  tmn-code: ${TMN_CODE}
  hash-secret: ${HASH_SECRET}
  pay-url: ${PAY_URL}
  return-url: ${RETURN_URL}
  api-url: ${API_URL_VNPAY}
  frontend-return-url: ${FRONTEND_RETURN_URL}

openai:
  api-url: ${API_URL_OPEN_AI}
  api-key: ${API_KEY}
  model: ${MODEL}
  max-tokens: 1000
  temperature: 0.7

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo}
    api-secret: ${CLOUDINARY_API_SECRET:demo}
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
api:
  prefix: /api/v1
jwt:
  signerKey:  ${JWT_SIGNER_KEY:local-dev-jwt-signer-key-change-me-please}
  access-expiration: 900000                 # 15 phút
  refresh-expiration: 604800000             # 7 ngày


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}
